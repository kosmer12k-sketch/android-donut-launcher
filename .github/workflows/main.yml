name: Build Donut Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8' # Для старых проектов времен Android Donut (1.6) лучше подходит JDK 8
          distribution: 'temurin'
          cache: gradle

      - name: Remove local.properties and grant gradlew permissions
        run: |
          rm -f local.properties
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
